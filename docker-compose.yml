services:
  postgres:
    image: postgres:17.4
    container_name: ecommerce-postgres
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: ecommerce-per
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
